<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Prueba Supabase</title>
</head>
<body>
  <h1>💖 Prueba de conexión 💖</h1>
  <div id="contador"></div>

  <input type="file" id="fileInput" accept="image/*">
  <button id="uploadBtn">Subir foto</button>
  <div id="status"></div>
  <div id="preview"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const supabaseUrl = "https://dummqfcymsyvopktgyqu.supabase.co";
    const supabaseKey = "sb_publishable_51lhdrJqsmEhCih3yqbqmw_dvxFkjjU";
    const client = window.supabase.createClient(supabaseUrl, supabaseKey);
    const BUCKET = "FOTOS";

    // 💞 Contador simple
    const fechaInicio = new Date("2026-05-16");
    const hoy = new Date();
    const dias = Math.floor((hoy - fechaInicio) / (1000 * 60 * 60 * 24));
    const meses = Math.floor(dias / 30.44);
    document.getElementById("contador").textContent =
      `Hoy cumplimos ${dias} días y ${meses} meses juntos 💞`;

    // 📸 Subida de UNA foto
    const fileInput = document.getElementById("fileInput");
    const uploadBtn = document.getElementById("uploadBtn");
    const status = document.getElementById("status");
    const preview = document.getElementById("preview");

    uploadBtn.addEventListener("click", async () => {
      const file = fileInput.files[0];
      if (!file) {
        status.textContent = "Selecciona una foto 💡";
        return;
      }
      status.textContent = "Subiendo foto...";

      const fileName = `${Date.now()}-${file.name.replace(/[^a-zA-Z0-9.-]/g, "_")}`;
      const { error: uploadError } = await client.storage.from(BUCKET).upload(fileName, file);
      if (uploadError) {
        console.error(uploadError);
        status.textContent = "Error al subir archivo";
        return;
      }

      const { data: urlData } = client.storage.from(BUCKET).getPublicUrl(fileName);
      status.textContent = "Foto subida con éxito 💖";

      const img = document.createElement("img");
      img.src = urlData.publicUrl;
      img.style.maxWidth = "300px";
      preview.appendChild(img);
    });
  </script>
</body>
</html>
