<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Un viaje de amor</title>
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(to bottom, #fff0f5, #ffe4e1);
      text-align: center;
      margin: 0;
      padding: 20px;
    }
    h1 { color: #c2185b; }
    #contador {
      font-size: 1.2rem;
      color: #c2185b;
      margin-bottom: 20px;
    }
    .upload-box {
      background: white;
      max-width: 420px;
      margin: 0 auto 20px;
      padding: 20px;
      border-radius: 20px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.1);
    }
    .btn {
      background: #e91e63;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 50px;
      cursor: pointer;
      font-weight: 500;
      transition: 0.3s;
    }
    .btn:hover { background: #c2185b; }
    .mes-grupo { margin-top: 40px; }
    .mes-titulo {
      font-size: 1.3rem;
      color: #c2185b;
      margin-bottom: 15px;
    }
    #preview {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 30px;
      max-width: 900px;
      margin: 0 auto;
    }
    .photo-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
    }
    .photo-card {
      position: relative;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      animation: aparecer 0.5s ease;
    }
    .photo-card img {
      width: 100%;
      height: 180px;
      object-fit: cover;
    }
    @keyframes aparecer {
      from { opacity: 0; transform: scale(0.9); }
      to { opacity: 1; transform: scale(1); }
    }
    @keyframes flotar {
      0% { transform: translateY(0); opacity: 1; }
      100% { transform: translateY(-100vh); opacity: 0; }
    }
    .corazon {
      position: fixed;
      bottom: 0;
      font-size: 1.5rem;
      color: #e91e63;
      animation: flotar 6s linear;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <h1>💖 Un viaje de amor 💖</h1>
  <div id="contador"></div>

  <div class="upload-box">
    <input type="file" id="fileInput" accept="image/*" multiple>
    <input type="date" id="dateInput">
    <button class="btn" id="uploadBtn">Subir fotos</button>
    <div id="status"></div>
  </div>

  <div id="preview"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    // 💞 Contador automático
    const fechaInicio = new Date("2026-05-16");
    const hoy = new Date();
    const dias = Math.floor((hoy - fechaInicio) / (1000 * 60 * 60 * 24));
    const meses = Math.floor(dias / 30.44);
    document.getElementById("contador").textContent = `Hoy cumplimos ${dias} días ${meses} meses juntos 💞`;

    // 💗 Corazones flotando
    setInterval(() => {
      const c = document.createElement("div");
      c.className = "corazon";
      c.textContent = "💗";
      c.style.left = Math.random() * 100 + "vw";
      document.body.appendChild(c);
      setTimeout(() => c.remove(), 6000);
    }, 800);

    // 🔗 Supabase
    const supabaseUrl = "https://dummqfcymsyvopktgyqu.supabase.co";
    const supabaseKey = "sb_publishable_51lhdrJqsmEhCih3yqbqmw_dvxFkjjU";
    const BUCKET = "FOTOS";
    const client = window.supabase.createClient(supabaseUrl, supabaseKey);

    const fileInput = document.getElementById("fileInput");
    const dateInput = document.getElementById("dateInput");
    const uploadBtn = document.getElementById("uploadBtn");
    const status = document.getElementById("status");
    const preview = document.getElementById("preview");

    uploadBtn.addEventListener("click", async () => {
      const files = fileInput.files;
      const fechaElegida = dateInput.value ? new Date(dateInput.value) : new Date();
      if (!files.length) {
        status.textContent = "Selecciona al menos una foto 💡";
        status.style.color = "#e91e63";
        return;
      }

      status.textContent = "Subiendo fotos...";
      status.style.color = "#666";

      for (const file of files) {
        const fechaStr = fechaElegida.toISOString().split("T")[0];
        const fileName = `${fechaStr}-${Date.now()}-${file.name.replace(/[^a-zA-Z0-9.-]/g, "_")}`;
        const { error } = await client.storage.from(BUCKET).upload(fileName, file);
        if (!error) {
          const { data: urlData } = client.storage.from(BUCKET).getPublicUrl(fileName);
          // Guardar URL y fecha en la tabla
          await client.from("album").insert({
            url: urlData.publicUrl,
            fecha: fechaStr
          });
        }
      }

      status.textContent = "Fotos subidas con éxito 💖";
      status.style.color = "#2e7d32";
      mostrarFotos();

      fileInput.value = "";
      dateInput.value = "";
    });

    async function mostrarFotos() {
      preview.innerHTML = "";
      const { data, error } = await client.from("album").select("url, fecha").order("id", { ascending: false });
      if (error) {
        preview.innerHTML = "<p>Error al cargar fotos.</p>";
        return;
      }

      const gruposPorMes = {};
      for (const foto of data) {
        const fecha = new Date(foto.fecha);
        const mes = fecha.toLocaleString("es-ES", { month: "long", year: "numeric" });
        if (!gruposPorMes[mes]) gruposPorMes[mes] = [];
        gruposPorMes[mes].push(foto);
      }

      for (const mes in gruposPorMes) {
