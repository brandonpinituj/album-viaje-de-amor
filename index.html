<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Un viaje de amor</title>
  <style>
    body { font-family: 'Poppins', sans-serif; background: #fff0f5; text-align: center; }
    h1 { color: #c2185b; }
    .upload-box { background: white; padding: 20px; border-radius: 12px; margin: 0 auto 20px; max-width: 400px; }
    .btn { background: #e91e63; color: white; border: none; padding: 10px 20px; border-radius: 20px; cursor: pointer; }
    .btn:hover { background: #c2185b; }
    .photo-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 10px; }
    .photo-card { position: relative; }
    .photo-card img { width: 100%; height: 150px; object-fit: cover; border-radius: 8px; }
    .btn-delete { position: absolute; top: 5px; right: 5px; background: #fff; border: none; cursor: pointer; font-size: 18px; }
  </style>
</head>
<body>
  <h1>💖 Un viaje de amor 💖</h1>

  <div class="upload-box">
    <input type="file" id="fileInput" accept="image/*" multiple>
    <input type="date" id="dateInput">
    <button class="btn" id="uploadBtn">Subir fotos</button>
    <div id="status"></div>
  </div>

  <div id="preview"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const supabaseUrl = "https://dummqfcymsyvopktgyqu.supabase.co";
    const supabaseKey = "sb_publishable_51lhdrJqsmEhCih3yqbqmw_dvxFkjjU";
    const client = window.supabase.createClient(supabaseUrl, supabaseKey);
    const BUCKET = "FOTOS";

    const fileInput = document.getElementById("fileInput");
    const dateInput = document.getElementById("dateInput");
    const uploadBtn = document.getElementById("uploadBtn");
    const status = document.getElementById("status");
    const preview = document.getElementById("preview");

    uploadBtn.addEventListener("click", async () => {
      const files = fileInput.files;
      const fechaElegida = dateInput.value ? new Date(dateInput.value) : new Date();
      if (!files.length) { status.textContent = "Selecciona al menos una foto 💡"; return; }
      status.textContent = "Subiendo fotos...";

      for (const file of files) {
        const fechaStr = fechaElegida.toISOString().split("T")[0];
        const fileName = `${fechaStr}-${Date.now()}-${file.name.replace(/[^a-zA-Z0-9.-]/g,"_")}`;

        const { error: uploadError } = await client.storage.from(BUCKET).upload(fileName, file);
        if (uploadError) { console.error(uploadError); status.textContent = "Error al subir archivo"; return; }

        const { data: urlData } = client.storage.from(BUCKET).getPublicUrl(fileName);
        const { error: insertError } = await client.from("album").insert({ url: urlData.publicUrl, fecha: fechaStr });
        if (insertError) { console.error(insertError); status.textContent = "Error al guardar en tabla"; return; }
      }

      status.textContent = "Fotos subidas con éxito 💖";
      mostrarFotos();
      fileInput.value = ""; dateInput.value = "";
    });

    async function mostrarFotos() {
      preview.innerHTML = "";
      const { data, error } = await client.from("album").select("id, url, fecha").order("id",{ascending:false});
      if (error) { console.error(error); return; }

      const gruposPorMes = {};
      for (const foto of data) {
        const fecha = new Date(foto.fecha);
        const mes = fecha.toLocaleString("es-ES",{month:"long",year:"numeric"});
        if (!gruposPorMes[mes]) gruposPorMes[mes] = [];
        gruposPorMes[mes].push(foto);
      }

      for (const mes in gruposPorMes) {
        const grupoDiv = document.createElement("div");
        grupoDiv.innerHTML = `<h3>📅 ${mes}</h3>`;
        const grid = document.createElement("div");
        grid.className = "photo-grid";

        for (const foto of gruposPorMes[mes]) {
          const card = document.createElement("div");
          card.className = "photo-card";
          card.innerHTML = `
            <img src="${foto.url}" alt="Foto">
            <button class="btn-delete">🗑️</button>
          `;
          card.querySelector(".btn-delete").addEventListener("click", async () => {
            // Eliminar de la tabla
            const { error: deleteError } = await client.from("album").delete().eq("id", foto.id);
            if (deleteError) { console.error(deleteError); alert("Error al eliminar de tabla"); return; }

            // Eliminar del bucket
            const path = foto.url.split("/").pop(); // obtiene el nombre del archivo
            const { error: bucketError } = await client.storage.from(BUCKET).remove([path]);
            if (bucketError) { console.error(bucketError); alert("Error al eliminar del bucket"); return; }

            alert("Foto eliminada con éxito 💔");
            mostrarFotos();
          });
          grid.appendChild(card);
        }

        grupoDiv.appendChild(grid);
        preview.appendChild(grupoDiv);
      }
    }

    mostrarFotos();
  </script>
</body>
</html>
