<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Un viaje de amor</title>
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(to bottom, #fff0f5, #ffe4e1);
      text-align: center;
      margin: 0;
      padding: 20px;
    }
    h1 {
      color: #c2185b;
    }
    #contador {
      font-size: 1.2rem;
      color: #c2185b;
      margin-bottom: 20px;
    }
    .upload-box {
      background: white;
      max-width: 420px;
      margin: 0 auto 20px;
      padding: 20px;
      border-radius: 20px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.1);
    }
    .btn {
      background: #e91e63;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 50px;
      cursor: pointer;
      font-weight: 500;
      transition: 0.3s;
    }
    .btn:hover {
      background: #c2185b;
    }
    .mes-grupo {
      margin-top: 40px;
    }
    .mes-titulo {
      font-size: 1.3rem;
      color: #c2185b;
      margin-bottom: 15px;
    }
    #preview {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 30px;
      max-width: 900px;
      margin: 0 auto;
    }
    .photo-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 15px;
    }
    .photo-card {
      position: relative;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      animation: aparecer 0.5s ease;
    }
    .photo-card img {
      width: 100%;
      height: 180px;
      object-fit: cover;
    }
    .delete-btn {
      position: absolute;
      top: 8px;
      right: 8px;
      background: rgba(233,30,99,0.8);
      color: white;
      border: none;
      border-radius: 6px;
      padding: 4px 8px;
      cursor: pointer;
      font-size: 0.8rem;
    }
    .delete-btn:hover {
      background: #c2185b;
    }
    @keyframes aparecer {
      from { opacity: 0; transform: scale(0.9); }
      to { opacity: 1; transform: scale(1); }
    }
    @keyframes flotar {
      0% { transform: translateY(0); opacity: 1; }
      100% { transform: translateY(-100vh); opacity: 0; }
    }
    .corazon {
      position: fixed;
      bottom: 0;
      font-size: 1.5rem;
      color: #e91e63;
      animation: flotar 6s linear;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <h1>💖 Un viaje de amor 💖</h1>
  <div id="contador"></div>

  <div class="upload-box">
    <input type="file" id="fileInput" accept="image/*">
    <button class="btn" id="uploadBtn">Subir foto</button>
    <div id="status"></div>
  </div>

  <div id="preview"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    // 💞 Contador automático de días y meses
    const fechaInicio = new Date("2026-05-16");
    const hoy = new Date();
    const dias = Math.floor((hoy - fechaInicio) / (1000 * 60 * 60 * 24));
    const meses = Math.floor(dias / 30.44);
    document.getElementById("contador").textContent = `Hoy cumplimos ${dias} días ${meses} meses juntos 💞`;

    // 💗 Corazones flotando
    setInterval(() => {
      const c = document.createElement("div");
      c.className = "corazon";
      c.textContent = "💗";
      c.style.left = Math.random() * 100 + "vw";
      document.body.appendChild(c);
      setTimeout(() => c.remove(), 6000);
    }, 800);

    // 🔗 Conexión Supabase
    const supabaseUrl = "https://dummqfcymsyvopktgyqu.supabase.co";
    const supabaseKey = "sb_publishable_51lhdrJqsmEhCih3yqbqmw_dvxFkjjU";
    const BUCKET = "FOTOS";
    const client = window.supabase.createClient(supabaseUrl, supabaseKey);

    const fileInput = document.getElementById("fileInput");
    const uploadBtn = document.getElementById("uploadBtn");
    const status = document.getElementById("status");
    const preview = document.getElementById("preview");

    uploadBtn.addEventListener("click", async () => {
      const file = fileInput.files[0];
      if (!file) {
        status.textContent = "Selecciona una foto primero 💡";
        status.style.color = "#e91e63";
        return;
      }

      status.textContent = "Subiendo foto...";
      status.style.color = "#666";

      const fileName = `${Date.now()}-${file.name.replace(/[^a-zA-Z0-9.-]/g, "_")}`;
      const { error } = await client.storage.from(BUCKET).upload(fileName, file);

      if (error) {
        status.textContent = "Error al subir: " + error.message;
        status.style.color = "#e91e63";
      } else {
        status.textContent = "Foto subida con éxito 💖";
        status.style.color = "#2e7d32";
        mostrarFotos();
      }

      fileInput.value = "";
    });

    async function mostrarFotos() {
      preview.innerHTML = "";
      const { data, error } = await client.storage.from(BUCKET).list("", { limit: 200 });
      if (error) {
        preview.innerHTML = "<p>Error al cargar fotos.</p>";
        return;
      }

      // Ignorar archivos vacíos o de sistema
      const archivosValidos = (data || []).filter(item => item.name !== ".emptyFolderPlaceholder");

      // Agrupar fotos por mes
      const gruposPorMes = {};
      for (const foto of archivosValidos) {
        const fecha = new Date(foto.created_at);
        const mes = fecha.toLocaleString("es-ES", { month: "long", year: "numeric" });
        if (!gruposPorMes[mes]) gruposPorMes[mes] = [];
        gruposPorMes[mes].push(foto);
      }

      // Mostrar grupos
      for (const mes in gruposPorMes) {
        const grupoDiv = document.createElement("div");
        grupoDiv.className = "mes-grupo";
        grupoDiv.innerHTML = `<div class="mes-titulo">📅 ${mes}</div>`;

        const grid = document.createElement("div");
        grid.className = "photo-grid";

        for (const foto of gruposPorMes[mes]) {
          const { data: urlData } = client.storage.from(BUCKET).getPublicUrl(foto.name);
          const card = document.createElement("div");
          card.className = "photo-card";
          card.innerHTML = `
            <img src="${urlData.publicUrl}" alt="Foto">
            <button class="delete-btn" onclick="eliminarFoto('${foto.name}')">🗑️</button>
          `;
          grid.appendChild(card);
        }

        grupoDiv.appendChild(grid);
        preview.appendChild(grupoDiv);
      }
    }

    async function eliminarFoto(nombre) {
      if (confirm("¿Seguro que quieres eliminar esta foto?")) {
        const { error } = await client.storage.from(BUCKET).remove([nombre]);
        if (error) {
          alert("Error al eliminar: " + error.message);
        } else {
          mostrarFotos();
        }
      }
    }

    mostrarFotos();
  </script>
</body>
</html>
