<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Álbum Romántico</title>
  <style>
    body {
      font-family: 'Arial', sans-serif;
      background: linear-gradient(to bottom, #fff0f5, #ffe4e1);
      margin: 0;
      padding: 20px;
      text-align: center;
    }
    header {
      font-size: 1.8rem;
      color: #c2185b;
      margin-bottom: 20px;
    }
    #contador {
      font-size: 1.2rem;
      color: #c2185b;
      margin-bottom: 20px;
    }
    #fileInput {
      margin: 20px 0;
    }
    .gallery {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 15px;
    }
    .photo-card {
      width: 200px;
      height: 200px;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
      animation: aparecer 0.5s ease;
    }
    .photo-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    @keyframes aparecer {
      from { opacity: 0; transform: scale(0.9); }
      to { opacity: 1; transform: scale(1); }
    }
    @keyframes flotar {
      0% { transform: translateY(0); opacity: 1; }
      100% { transform: translateY(-100vh); opacity: 0; }
    }
    .corazon {
      position: fixed;
      bottom: 0;
      font-size: 1.5rem;
      color: #e91e63;
      animation: flotar 6s linear;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <header>💖 Nuestro Álbum Romántico 💖</header>
  <div id="contador"></div>

  <input type="file" id="fileInput" accept="image/*" multiple>
  <div class="gallery" id="gallery"></div>

  <script>
    // 💞 Contador automático de días desde su aniversario
    const fechaInicio = new Date("2026-05-16"); // cambia si fue otra fecha
    const hoy = new Date();
    const diasJuntos = Math.floor((hoy - fechaInicio) / (1000 * 60 * 60 * 24));
    document.getElementById("contador").textContent = `Hoy cumplimos ${diasJuntos} días juntos 💞`;

    // 📸 Subida de fotos desde la galería
    const fileInput = document.getElementById("fileInput");
    const gallery = document.getElementById("gallery");

    fileInput.addEventListener("change", (event) => {
      const files = event.target.files;
      for (const file of files) {
        const reader = new FileReader();
        reader.onload = (e) => {
          const photoCard = document.createElement("div");
          photoCard.className = "photo-card";
          photoCard.innerHTML = `<img src="${e.target.result}" alt="Foto">`;
          gallery.appendChild(photoCard);
        };
        reader.readAsDataURL(file);
      }
    });

    // 💗 Corazones flotando
    setInterval(() => {
      const c = document.createElement("div");
      c.className = "corazon";
      c.textContent = "💗";
      c.style.left = Math.random() * 100 + "vw";
      document.body.appendChild(c);
      setTimeout(() => c.remove(), 6000);
    }, 800);
  </script>
</body>
</html>
