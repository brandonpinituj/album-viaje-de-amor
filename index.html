<!-- Carga la librería de Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- Aquí va tu código JavaScript -->
<script>
  const supabaseUrl = "https://dummqfcymsyvopktgyqu.supabase.co";
  const supabaseKey = "sb_publishable_51lhdrJqsmEhCih3yqbqmw_dvxFkjjU";
  const client = window.supabase.createClient(supabaseUrl, supabaseKey);
  const BUCKET = "FOTOS";

  // 💞 Contador automático de días y meses
  const fechaInicio = new Date("2026-05-16");
  function actualizarContador() {
    const hoy = new Date();
    const dias = Math.floor((hoy - fechaInicio) / (1000 * 60 * 60 * 24));
    const meses = Math.floor(dias / 30.44);
    document.getElementById("contador").textContent =
      `Hoy cumplimos ${dias} días y ${meses} meses juntos 💞`;
  }
  actualizarContador();

  // Corazones flotando
  setInterval(() => {
    const c = document.createElement("div");
    c.className = "corazon";
    c.textContent = "💗";
    c.style.left = Math.random() * 100 + "vw";
    document.body.appendChild(c);
    setTimeout(() => c.remove(), 6000);
  }, 800);

  // Subida de fotos
  const fileInput = document.getElementById("fileInput");
  const dateInput = document.getElementById("dateInput");
  const uploadBtn = document.getElementById("uploadBtn");
  const status = document.getElementById("status");
  const preview = document.getElementById("preview");

  uploadBtn.addEventListener("click", async () => {
    const files = fileInput.files;
    const fechaElegida = dateInput.value ? new Date(dateInput.value) : new Date();
    if (!files.length) {
      status.textContent = "Selecciona al menos una foto 💡";
      return;
    }
    status.textContent = "Subiendo fotos...";

    for (const file of files) {
      const fechaStr = fechaElegida.toISOString().split("T")[0];
      const fileName = `${fechaStr}-${Date.now()}-${file.name.replace(/[^a-zA-Z0-9.-]/g, "_")}`;
      const { error: uploadError } = await client.storage.from(BUCKET).upload(fileName, file);
      if (uploadError) {
        console.error(uploadError);
        status.textContent = "Error al subir archivo";
        return;
      }
      const { data: urlData } = client.storage.from(BUCKET).getPublicUrl(fileName);
      const { error: insertError } = await client.from("album").insert({
        url: urlData.publicUrl,
        fecha: fechaStr
      });
      if (insertError) {
        console.error(insertError);
        status.textContent = "Error al guardar en tabla";
        return;
      }
    }
    status.textContent = "Fotos subidas con éxito 💖";
  });
</script>
