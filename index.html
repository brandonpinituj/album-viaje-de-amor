<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Un viaje de amor</title>
  <style>
    body { font-family: 'Poppins', sans-serif; background: #fff0f5; text-align: center; }
    h1 { color: #c2185b; }
    #contador { margin-bottom: 10px; color: #c2185b; font-weight: bold; }
    #notas p { font-size: 1.2rem; color: #e91e63; margin: 10px 0; }
    .upload-box { background: white; padding: 20px; border-radius: 12px; margin: 0 auto 20px; max-width: 400px; }
    .btn { background: #e91e63; color: white; border: none; padding: 10px 20px; border-radius: 20px; cursor: pointer; }
    .btn:hover { background: #c2185b; }
    .photo-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 10px; }
    .photo-card img { width: 100%; height: auto; object-fit: contain; border-radius: 8px; cursor: pointer; }
    .modal { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); justify-content:center; align-items:center; }
    .modal img { max-width:90%; max-height:80%; border-radius:12px; }
    .modal .close { position:absolute; top:20px; right:30px; font-size:30px; color:white; cursor:pointer; }
    .corazon { position:fixed; bottom:0; font-size:1.5rem; color:#e91e63; animation:flotar 6s linear; pointer-events:none; }
    @keyframes flotar { 0%{transform:translateY(0);opacity:1;} 100%{transform:translateY(-100vh);opacity:0;} }
  </style>
</head>
<body>
  <h1>💖 Un viaje de amor 💖</h1>
  <div id="contador"></div>
  <div id="notas"></div>

  <div class="upload-box">
    <input type="file" id="fileInput" accept="image/*" multiple>
    <input type="date" id="dateInput">
    <button class="btn" id="uploadBtn">Subir fotos</button>
    <div id="status"></div>
  </div>

  <div id="preview"></div>

  <div id="modal" class="modal">
    <span class="close">&times;</span>
    <img id="modalImg" src="">
    <div>
      <input type="date" id="editDate">
      <button class="btn" id="saveDate">Guardar fecha</button>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const supabaseUrl = "https://dummqfcymsyvopktgyqu.supabase.co";
    const supabaseKey = "sb_publishable_51lhdrJqsmEhCih3yqbqmw_dvxFkjjU";
    const client = window.supabase.createClient(supabaseUrl, supabaseKey);
    const BUCKET = "FOTOS";

    const fileInput = document.getElementById("fileInput");
    const dateInput = document.getElementById("dateInput");
    const uploadBtn = document.getElementById("uploadBtn");
    const status = document.getElementById("status");
    const preview = document.getElementById("preview");

    const modal = document.getElementById("modal");
    const modalImg = document.getElementById("modalImg");
    const editDate = document.getElementById("editDate");
    const saveDate = document.getElementById("saveDate");
    let currentFoto = null;

    // Contador
    const fechaInicio = new Date("2026-05-16");
    function actualizarContador() {
      const hoy = new Date();
      const dias = Math.floor((hoy - fechaInicio) / (1000 * 60 * 60 * 24));
      const meses = Math.floor(dias / 30.44);
      document.getElementById("contador").textContent =
        `Hoy cumplimos ${dias} días y ${meses} meses juntos 💞`;
    }
    actualizarContador();

    // Notas románticas
    const frases = [
      "💌 Cada foto es un recuerdo de nuestro amor 💌",
      "🌹 Gracias por cada momento juntos 🌹",
      "✨ Nuestro viaje apenas comienza ✨",
      "💕 Eres mi razón de sonreír 💕"
    ];
    let i = 0;
    setInterval(() => {
      document.getElementById("notas").innerHTML = `<p>${frases[i]}</p>`;
      i = (i + 1) % frases.length;
    }, 5000);
    // Subida de fotos
    uploadBtn.addEventListener("click", async () => {
      const files = fileInput.files;
      const fechaElegida = dateInput.value ? new Date(dateInput.value) : new Date();
      if (!files.length) { status.textContent = "Selecciona al menos una foto 💡"; return; }
      status.textContent = "Subiendo fotos...";

      for (const file of files) {
        const fechaStr = fechaElegida.toISOString().split("T")[0];
        const fileName = `${fechaStr}-${Date.now()}-${file.name.replace(/[^a-zA-Z0-9.-]/g,"_")}`;
        const { error: uploadError } = await client.storage.from(BUCKET).upload(fileName, file);
        if (uploadError) { console.error(uploadError); status.textContent = "Error al subir archivo"; return; }
        const { data: urlData } = client.storage.from(BUCKET).getPublicUrl(fileName);
        const { error: insertError } = await client.from("album").insert({ url: urlData.publicUrl, fecha: fechaStr });
        if (insertError) { console.error(insertError); status.textContent = "Error al guardar en tabla"; return; }
      }
      status.textContent = "Fotos subidas con éxito 💖";
      mostrarFotos();
      fileInput.value = ""; dateInput.value = "";
    });
    // Mostrar fotos
    async function mostrarFotos() {
      preview.innerHTML = "";
      const { data, error } = await client.from("album").select("id, url, fecha").order("id",{ascending:false});
      if (error) { console.error(error); return; }

      const gruposPorMes = {};
      for (const foto of data) {
        const fecha = new Date(foto.fecha);
        const mes = fecha.toLocaleString("es-ES",{month:"long",year:"numeric"});
        if (!gruposPorMes[mes]) gruposPorMes[mes] = [];
        gruposPorMes[mes].push(foto);
      }

      for (const mes in gruposPorMes) {
        const grupoDiv = document.createElement("div");
        grupoDiv.innerHTML = `<h3>📅 ${mes}</h3>`;
        const grid = document.createElement("div");
        grid.className = "photo-grid";

        for (const foto of gruposPorMes[mes]) {
          const card = document.createElement("div");
          card.className = "photo-card";
          const img = document.createElement("img");
          img.src = foto.url;
          img.alt = "Foto";

          img.addEventListener("click", () => {
            modal.style.display = "flex";
            modalImg.src = foto.url;
            editDate.value = foto.fecha;
            currentFoto = foto;
          });

          // Long press para eliminar
          let pressTimer;
          img.addEventListener("mousedown", () => {
            pressTimer = setTimeout(async () => {
              if (confirm("¿Eliminar esta foto?")) {
                await client.from("album").delete().eq("id", foto.id);
                const path = foto.url.split("/").pop();
                await client.storage.from(BUCKET).remove([path]);
                mostrarFotos();
              }
            }, 1000); // 1 segundo presionado
          });
          img.addEventListener("mouseup", () => clearTimeout(pressTimer));
          img.addEventListener("mouseleave", () => clearTimeout(pressTimer));

          card.appendChild(img);
          grid.appendChild(card);
        }

        grupoDiv.appendChild(grid);
        preview.appendChild(grupoDiv);
      }
    }
    // Guardar fecha editada
    saveDate.addEventListener("click", async () => {
      if (currentFoto) {
        const { error } = await client.from("album").update({ fecha: editDate.value }).eq("id", currentFoto.id);
        if (error) {
          console.error(error);
          alert("Error al actualizar fecha");
          return;
        }
        alert("Fecha actualizada 💖");
        modal.style.display = "none";
        mostrarFotos();
      }
    });

    // Cerrar modal
    document.querySelector(".close").addEventListener("click", () => {
      modal.style.display = "none";
    });

    // Corazones flotando
    setInterval(() => {
      const c = document.createElement("div");
      c.className = "corazon";
      c.textContent = "💗";
      c.style.left = Math.random() * 100 + "vw";
      document.body.appendChild(c);
      setTimeout(() => c.remove(), 6000);
    }, 800);

    // Mostrar fotos al cargar
    mostrarFotos();
  </script>
</body>
</html>
